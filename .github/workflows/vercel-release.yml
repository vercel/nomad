name: Vercel release

on:
  push:
    branches:
      - vercel/main-2.0.5

permissions:
  contents: read

jobs:
  version:
    if: github.repository == 'vercel/nomad'
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.version.outputs.metadata }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Calculate release version
        id: version
        run: |
          base=319f64d1c63df290256bdca02277f64abfde2e34
          git merge-base --is-ancestor "$base" HEAD
          # Exclude the base commit itself from the count.
          metadata="vercel$(git rev-list --count "$base"..HEAD)"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"
          echo "version=$(make version)+$metadata" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      TARGET: linux_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
      - name: Build dependencies
        run: make deps
      - uses: ./.github/actions/setup-js
      - name: Generate release assets
        run: make prerelease
      # Compile and link against glibc 2.27 rather than the runner's glibc.
      # The existing builder also supplies an ARM64 cross compiler/sysroot.
      - name: Build glibc-compatible builder image
        run: |
          docker build --build-arg "GO_VERSION=$(cat .go-version)" \
            -t nomad-vercel-builder .github/nomad-builder
      - name: Build release
        env:
          VERSION_METADATA: ${{ needs.version.outputs.metadata }}
        run: |
          build_date=$(git show -s --format=%cI HEAD)
          ldflags="-X github.com/hashicorp/nomad/version.GitCommit=$(git rev-parse HEAD)"
          ldflags+=" -X github.com/hashicorp/nomad/version.BuildDate=$build_date"
          ldflags+=" -X github.com/hashicorp/nomad/version.VersionMetadata=$VERSION_METADATA"
          make deps
          docker run --rm \
            --volume "$PWD:/build" nomad-vercel-builder \
            make release TARGETS="$TARGET" CGO_ENABLED=1 \
              GO_TAGS="release ui hashicorpmetrics codegen_generated" GO_LDFLAGS="$ldflags"
      # ZIPs are internal build artifacts; public releases contain signed tars.
      - name: Stage build ZIP
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp "pkg/${TARGET}.zip" "dist/nomad_${RELEASE_VERSION}_${TARGET}.zip"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nomad-linux-${{ matrix.arch }}
          path: dist/*.zip
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.repository == 'vercel/nomad' && github.event_name == 'push' && github.ref == 'refs/heads/vercel/main-2.0.5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nomad-*
          merge-multiple: true
          path: inputs
      - uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07
        with:
          cosign-release: v3.1.4
      - name: Sign and package release binaries
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            stage=$(mktemp -d "$RUNNER_TEMP/nomad-sign.XXXXXX")
            archive="$GITHUB_WORKSPACE/inputs/nomad_${RELEASE_VERSION}_linux_${arch}.zip"
            unzip -p "$archive" nomad > "$stage/nomad"
            unzip -p "$archive" LICENSE.txt > "$stage/LICENSE.txt"
            chmod 755 "$stage/nomad"
            jq -n --arg version "$RELEASE_VERSION" --arg arch "$arch" \
              --arg commit "$COMMIT" \
              '{version: $version, os: "linux", arch: $arch, commit: $commit}' \
              > "$stage/release.json"
            (
              cd "$stage" || exit 1
              sha256sum nomad LICENSE.txt release.json > manifest.sha256
              cosign sign-blob --yes --bundle manifest.sha256.sigstore.json manifest.sha256
              cosign verify-blob --bundle manifest.sha256.sigstore.json \
                --certificate-identity 'https://github.com/vercel/nomad/.github/workflows/vercel-release.yml@refs/heads/vercel/main-2.0.5' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-github-workflow-repository vercel/nomad \
                --certificate-github-workflow-trigger push \
                --certificate-github-workflow-sha "$COMMIT" manifest.sha256
              sha256sum --check manifest.sha256
            )
            tar -cf "dist/nomad-${RELEASE_VERSION}-${arch}.tar" -C "$stage" \
              nomad LICENSE.txt release.json manifest.sha256 manifest.sha256.sigstore.json
            rm -rf "$stage"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar --clobber
          else
            gh release create "$tag" dist/*.tar \
              --target "$COMMIT" \
              --title "Nomad $RELEASE_VERSION" \
              --notes "Linux amd64/arm64 builds of $GITHUB_REF_NAME at $COMMIT." \
              --latest=false
          fi
