name: Vercel release

on:
  push:
    branches:
      - vercel/main-2.0.5

permissions:
  contents: read

jobs:
  version:
    if: github.repository == 'vercel/nomad'
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.version.outputs.metadata }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Calculate release version
        id: version
        run: |
          base=319f64d1c63df290256bdca02277f64abfde2e34
          git merge-base --is-ancestor "$base" HEAD
          # Exclude the base commit itself from the count.
          metadata="vercel$(git rev-list --count "$base"..HEAD)"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"
          echo "version=$(make version)+$metadata" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            arch: amd64
            runner: ubuntu-latest
          - goos: linux
            arch: arm64
            runner: ubuntu-latest
          - goos: darwin
            arch: arm64
            runner: macos-latest
    env:
      TARGET: ${{ matrix.goos }}_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Install macOS packaging tools
        if: runner.os == 'macOS'
        run: command -v zstd || brew install zstd
      - name: Build dependencies
        run: make deps
      - uses: ./.github/actions/setup-js
      - name: Generate release assets
        run: make prerelease
      # Compile and link against glibc 2.27 rather than the runner's glibc.
      # The existing builder also supplies an ARM64 cross compiler/sysroot.
      - name: Build glibc-compatible builder image
        if: runner.os == 'Linux'
        run: |
          docker build --build-arg "GO_VERSION=$(cat .go-version)" \
            -t nomad-vercel-builder .github/nomad-builder
      - name: Build release
        env:
          VERSION_METADATA: ${{ needs.version.outputs.metadata }}
        run: |
          build_date=$(git show -s --format=%cI HEAD)
          ldflags="-X github.com/hashicorp/nomad/version.GitCommit=$(git rev-parse HEAD)"
          ldflags+=" -X github.com/hashicorp/nomad/version.BuildDate=$build_date"
          ldflags+=" -X github.com/hashicorp/nomad/version.VersionMetadata=$VERSION_METADATA"
          if [ "$RUNNER_OS" = Linux ]; then
            docker run --rm --env CI=true --env GO_TAGS=release \
              --volume "$PWD:/build" nomad-vercel-builder \
              make "pkg/${TARGET}/nomad" CGO_ENABLED=1 GO_LDFLAGS="$ldflags"
          else
            CI=true GO_TAGS=release make "pkg/${TARGET}/nomad" \
              CGO_ENABLED=1 GO_LDFLAGS="$ldflags"
          fi
      - name: Compress binary
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          zstd -T0 "pkg/${TARGET}/nomad" \
            -o "dist/nomad_${RELEASE_VERSION}_${TARGET}.zst"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nomad-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/*.zst
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nomad-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: sha256sum -- *.zst > "nomad_${RELEASE_VERSION}_SHA256SUMS"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --target "$COMMIT" \
              --title "Nomad $RELEASE_VERSION" \
              --notes "Linux amd64/arm64 and macOS arm64 builds of $GITHUB_REF_NAME at $COMMIT." \
              --latest=false
          fi
